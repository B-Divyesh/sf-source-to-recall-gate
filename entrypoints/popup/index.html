<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Source-to-Recall Gate</title>
  </head>
  <body>
    <main class="popup-main">
      <div class="popup-brand"><img src="/icon/128.png" width="40" height="40" alt=""><span>Source → Recall</span></div>
      <p class="popup-kicker">Selection intake</p>
      <h1>Turn this selection into a decision.</h1>
      <p>Select a passage on the page, then send it to your private local gate.</p>
      <button class="popup-primary" type="button" data-capture>Capture selected text <span aria-hidden="true">→</span></button>
      <button class="popup-secondary" type="button" data-open>Open decision queue</button>
      <p class="popup-status" data-status role="status">Shortcut: Alt + Shift + G</p>
      <p class="popup-privacy">Only the text you select is read. No page scraping, cloud sync, or AI generation.</p>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
