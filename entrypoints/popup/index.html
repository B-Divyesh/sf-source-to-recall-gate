<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Source-to-Recall Gate</title>
  </head>
  <body>
    <main class="popup-main">
      <div class="popup-brand"><img src="/icon/128.png" width="40" height="40" alt=""><span>Source → Recall</span></div>
      <p class="popup-kicker">Selected study text</p>
      <h1>Save selected text for review</h1>
      <p>Select a passage on the page, then save it to this browser.</p>
      <button class="popup-primary" type="button" data-capture>Save selected text <span aria-hidden="true">→</span></button>
      <button class="popup-secondary" type="button" data-open>Review saved passages</button>
      <p class="popup-status" data-status role="status">Shortcut: Alt + Shift + G</p>
      <p class="popup-privacy">Only selected text is read. The extension does not scrape pages, sync data, or generate cards.</p>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
